<svg viewBox="0 0 1600 750" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
<defs>

      <style>
        .neon-ridge-glow {
          stroke: url(#neonRidgeGrad);
          stroke-width: 1.6;
          fill: none;
          filter: drop-shadow(0 0 6px rgba(14, 165, 233, 0.75)) drop-shadow(0 0 12px rgba(192, 132, 252, 0.5));
        }
        .neon-pulse-trail {
          stroke: #38bdf8;
          stroke-width: 2.2;
          fill: none;
          stroke-linecap: round;
          stroke-dasharray: 140 460;
          animation: ridgePulse 7s linear infinite;
        }
        .neon-pulse-trail-2 {
          stroke: #f472b6;
          stroke-width: 1.8;
          fill: none;
          stroke-linecap: round;
          stroke-dasharray: 100 500;
          animation: ridgePulse2 8.5s linear infinite;
        }
        @keyframes ridgePulse {
          0% { stroke-dashoffset: 600; }
          100% { stroke-dashoffset: 0; }
        }
        @keyframes ridgePulse2 {
          0% { stroke-dashoffset: 0; }
          100% { stroke-dashoffset: -600; }
        }
      </style>
      <linearGradient id="neonRidgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#0284c7" stop-opacity="0.85"/>
        <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.95"/>
        <stop offset="50%" stop-color="#f472b6" stop-opacity="0.9"/>
        <stop offset="75%" stop-color="#c084fc" stop-opacity="0.85"/>
        <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.9"/>
      </linearGradient>
      <linearGradient id="facetLight1" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.45"/>
        <stop offset="50%" stop-color="#f1f5f9" stop-opacity="0.2"/>
        <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.35"/>
      </linearGradient>
      <linearGradient id="facetLight2" x1="100%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
        <stop offset="60%" stop-color="#bae6fd" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#fce7f3" stop-opacity="0.2"/>
      </linearGradient>
      <linearGradient id="valleyLight" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#f0f9ff" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8"/>
      </linearGradient>
    
</defs>
