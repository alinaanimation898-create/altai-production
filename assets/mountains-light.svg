<svg viewBox="0 0 1600 720" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
<defs>

      <linearGradient id="skyGlow" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.9"/>
        <stop offset="50%" stop-color="#f5d0fe" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.8"/>
